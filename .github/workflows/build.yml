name: Build Smart Keyboard APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Create local.properties (SDK path)
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle wrapper --gradle-version 8.7
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartKeyboard-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # Decode keystore from secret (safe — no secrets in if: condition)
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/smartkeyboard-release.keystore
            echo "Keystore decoded successfully"
            ls -la app/keystore/
          else
            echo "No KEYSTORE_BASE64 secret found — will build unsigned release"
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: app/keystore/smartkeyboard-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APKs (split per ABI + universal)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SmartKeyboard-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: warn
